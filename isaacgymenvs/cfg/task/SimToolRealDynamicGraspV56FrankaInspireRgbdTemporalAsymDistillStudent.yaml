defaults:
  - SimToolRealDynamicGraspV55FrankaInspireRgbdTemporalDistillStudent
  - _self_

env:
  # V56 keeps V55's deployable RGB-D/mask temporal pointcloud actor input, while
  # giving the frozen teacher the cleaner V53-style mesh-surface pointcloud.
  distillationWeightBase: 1.0
  distillationWeightLifted: 2.0
  distillationWeightTrueGrasp: 1.0
  distillationWeightStableGrasp: 3.0
  distillationWeightMax: 8.0

  distillationTeacherObsList:
    [
      "joint_pos",
      "joint_vel",
      "prev_action_targets",
      "palm_pos",
      "palm_rot",
      "palm_vel",
      "fingertip_pos_rel_palm",
      "teacher_object_pointcloud_rel_palm",
      "teacher_object_pointcloud_centroid_rel_palm",
      "teacher_object_pointcloud_vel_rel_palm",
      "teacher_object_pointcloud_tracking_confidence",
      "object_vel_rel_palm",
      "affordance_pos_rel_palm",
      "future_affordance_pos_rel_palm",
      "affordance_axis_rel_palm",
      "affordance_confidence",
    ]
