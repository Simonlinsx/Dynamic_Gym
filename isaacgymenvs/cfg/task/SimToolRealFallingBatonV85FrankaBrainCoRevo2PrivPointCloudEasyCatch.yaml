  dynamicGraspPalmReachRewScale: 24.0
  dynamicGraspPalmReachDistanceScale: 0.42
  dynamicGraspFingertipReachRewScale: 34.0
  dynamicGraspFingertipReachDistanceScale: 0.30
  dynamicGraspContactProgressRewScale: 90.0
  dynamicGraspContactProgressVelScale: 0.42
  dynamicGraspSurfaceContactDistance: 0.085
  dynamicGraspTrueGraspQualityRewScale: 55.0
  dynamicGraspOpposingContactRewScale: 90.0
  dynamicGraspThumbOppositionRewScale: 45.0
  dynamicGraspTrueGraspBonusRewScale: 260.0

  dynamicGraspBinaryAffordancePositiveContactRewScale: 16.0
  dynamicGraspBinaryAffordanceNegativeContactPenaltyScale: 3.0

  dynamicGraspSuccessSteps: 6
  dynamicGraspStableFingertipDistance: 0.11
  dynamicGraspStableObjectPalmVel: 0.32
  dynamicGraspStableHoldRewScale: 260.0
  dynamicGraspStableProgressRewScale: 360.0
