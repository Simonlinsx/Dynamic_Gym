env:
  # V85: make the first curriculum stage genuinely catchable.  The object still
  # spawns in the front workspace, but starts closer to the home catch center
  # and with much smaller initial linear/angular velocity.
  episodeLength: 200

  fallingBatonSpawnZRange: [0.76, 0.90]
  fallingBatonForwardWorkspaceXRange: [-0.16, 0.16]
  fallingBatonForwardWorkspaceYRange: [0.12, 0.34]
  fallingBatonSpawnAvoidArmMinXYDistance: 0.14
  fallingBatonSpawnAvoidArmIters: 3
  fallingBatonSpawnAbovePalmRange: [0.16, 0.28]

  fallingBatonCatchCenterFingerWeight: 0.75
  fallingBatonCatchCenterForwardOffset: 0.055
  fallingBatonCatchCenterWorldOffset: [0.0, 0.02, 0.0]
  fallingBatonPalmRelativeStartXRange: [-0.015, 0.015]
  fallingBatonPalmRelativeStartYRange: [0.015, 0.045]
  fallingBatonPalmRelativeXRange: [-0.055, 0.055]
  fallingBatonPalmRelativeYRange: [0.00, 0.11]

  fallingBatonInitialXYSpeedRange: [0.00, 0.08]
  fallingBatonStartInitialXYSpeedRange: [0.00, 0.005]
  fallingBatonInitialZSpeedRange: [0.05, 0.32]
  fallingBatonStartInitialZSpeedRange: [0.00, 0.015]
  fallingBatonInitialAngVelRange: [-1.5, 1.5]
  fallingBatonStartInitialAngVelRange: [-0.08, 0.08]

  fallingBatonCatchMinHeight: 0.46
  fallingBatonStableObjectSpeed: 0.55
  fallingBatonStableObjectAngSpeed: 6.0

  dynamicGraspSpeedCurriculumMetric: "true_grasp"
  dynamicGraspSpeedCurriculumStartSuccess: 0.02
