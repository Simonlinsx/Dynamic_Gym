<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Falling Baton task schematic</title>
  <desc id="desc">A Franka-style arm with a dexterous hand catches a falling baton from a row of colored sticks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="0.56" stop-color="#28323d"/>
      <stop offset="1" stop-color="#151a20"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#303946"/>
      <stop offset="1" stop-color="#1f252d"/>
    </linearGradient>
    <linearGradient id="robot" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2f3ef"/>
      <stop offset="1" stop-color="#9aa1a7"/>
    </linearGradient>
    <linearGradient id="batonBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#0e48b8"/>
      <stop offset="0.5" stop-color="#237cff"/>
      <stop offset="1" stop-color="#092b76"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>
  <path d="M0 440 C230 392 412 392 635 438 C825 478 1018 462 1200 430 L1200 680 L0 680 Z" fill="url(#floor)"/>
  <path d="M0 486 C318 520 641 520 1200 474" fill="none" stroke="#556171" stroke-width="2" opacity="0.35"/>

  <g opacity="0.95" filter="url(#softShadow)">
    <rect x="172" y="137" width="856" height="35" rx="18" fill="url(#batonBlue)"/>
    <rect x="218" y="0" width="30" height="174" rx="15" fill="#d14c35"/>
    <rect x="346" y="0" width="30" height="174" rx="15" fill="#da9228"/>
    <rect x="478" y="0" width="30" height="174" rx="15" fill="#4d9d43"/>
    <rect x="616" y="0" width="30" height="174" rx="15" fill="#23a0d0"/>
    <rect x="748" y="0" width="30" height="174" rx="15" fill="#8460b5"/>
    <rect x="884" y="0" width="30" height="174" rx="15" fill="#c94d78"/>
  </g>

  <g fill="none" stroke="#79c8ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.78">
    <path d="M702 128 C688 214 656 285 611 354"/>
    <path d="M611 354 C584 394 556 426 526 454"/>
