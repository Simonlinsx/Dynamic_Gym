      <path d="M-42 65 C-18 44 44 43 82 62 L70 116 L-18 116 Z" fill="#d3d7da"/>
      <rect x="-36" y="100" width="128" height="34" rx="17" fill="#10151b"/>
      <circle cx="26" cy="118" r="12" fill="#c6cbd0"/>
    </g>

