        <path d="M114 -3 C142 -19 164 -6 156 20"/>
        <path d="M111 11 C135 26 142 49 121 57"/>
        <path d="M92 16 C91 43 76 57 58 48"/>
      </g>
      <g stroke="#1a1d22" stroke-width="3" stroke-linecap="round" opacity="0.75">
        <path d="M126 -23 L145 -30"/>
        <path d="M136 -8 L158 -7"/>
        <path d="M127 27 L139 48"/>
        <path d="M91 27 L74 46"/>
      </g>
    </g>
  </g>

  <g transform="translate(708 145) rotate(-7)" filter="url(#softShadow)">
    <rect x="-20" y="-95" width="40" height="190" rx="20" fill="#68a7ff"/>
    <rect x="-17" y="-88" width="34" height="176" rx="17" fill="#8cbcff" opacity="0.55"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#f5f7f7">
    <text x="58" y="70" font-size="34" font-weight="800">Falling Baton</text>
    <text x="58" y="111" font-size="20" fill="#c9d7df">Active stick-catching game: predict, intercept, grasp, hold.</text>
    <text x="764" y="84" font-size="18" fill="#dce7ec">falling rod with random spin</text>
    <text x="760" y="425" font-size="18" fill="#dce7ec">safe middle / handle affordance</text>
  </g>
