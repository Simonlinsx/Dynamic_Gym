      <path d="M-38 42 C-55 6 -48 -32 -17 -52 C19 -75 66 -48 62 -6 C58 36 18 55 -38 42 Z" fill="url(#robot)"/>
      <circle cx="17" cy="-9" r="38" fill="#15181d"/>
      <circle cx="17" cy="-9" r="27" fill="#aeb5ba"/>
    </g>

    <g transform="translate(455 485) rotate(22)">
